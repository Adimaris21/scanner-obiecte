<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Obiecte Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Bara de sus vizibila mereu */
        #top-bar {
            background: #1e1e1e;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            z-index: 30;
            border-bottom: 1px solid #333;
        }
        #api-input {
            flex: 1;
            min-width: 150px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #000;
            color: #00e676;
            font-size: 13px;
        }
        #save-key-btn {
            padding: 8px 14px;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }
        #status {
            width: 100%;
            font-size: 12px;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }
        /* Zona camerei */
        #camera-box {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }
        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        canvas { z-index: 5; pointer-events: none; }
        #start-cam-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 25;
            padding: 16px 26px;
            font-size: 16px;
            font-weight: bold;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 12px;
        }
        /* Panou jos */
        #bottom-bar {
            position: absolute;
            bottom: 20px; left: 12px; right: 12px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #result-box {
            width: 100%;
            background: rgba(15, 15, 20, 0.95);
            border: 1.5px solid #00e676;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
            white-space: pre-line;
        }
        #analyze-btn {
            width: 100%;
            max-width: 340px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 50px;
        }
        #analyze-btn:disabled { background: #555; }
    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="api-input" placeholder="Lipește aici cheia API...">
        <button id="save-key-btn" onclick="salveazaCheie()">Salvează</button>
        <div id="status">
            <span id="status-msg">Se încarcă AI...</span>
            <span id="fps-msg">0 FPS</span>
        </div>
    </div>

    <div id="camera-box">
        <button id="start-cam-btn" onclick="pornesteCamera()">Pornește Camera</button>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="bottom-bar">
            <div id="result-box" onclick="this.style.display='none'"></div>
            <button id="analyze-btn" onclick="analizeazaExact()">Analizează exact (Ce / Cine / Culoare)</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        const fpsMsg = document.getElementById('fps-msg');
        const apiInput = document.getElementById('api-input');
        const startCamBtn = document.getElementById('start-cam-btn');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultBox = document.getElementById('result-box');

        const colorCanvas = document.createElement('canvas');
        const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });

        let model = null;
        let lastTime = performance.now();

        // Încarcă cheia salvată anterior în căsuță
        apiInput.value = localStorage.getItem('gemini_api_key') || '';

        function salveazaCheie() {
            const val = apiInput.value.trim();
            if (!val) {
                alert("Lipește cheia în căsuța din stânga mai întâi!");
                return;
            }
            localStorage.setItem('gemini_api_key', val);
            statusMsg.innerText = "Cheie API salvată!";
            alert("Cheia a fost salvată!");
        }

        const traduceri = {
            "person": "Persoană", "cell phone": "Telefon", "bottle": "Sticlă",
            "cup": "Cană / Pahar", "laptop": "Laptop", "keyboard": "Tastatură",
            "mouse": "Mouse", "chair": "Scaun", "book": "Carte", "car": "Mașină",
            "dog": "Câine", "cat": "Pisică", "backpack": "Rucsac", "tv": "Monitor / TV",
            "remote": "Telecomandă", "scissors": "Foarfecă", "bowl": "Bol", "spoon": "Lingură"
        };

        function getCuloare(x, y, w, h) {
            try {
                const cx = Math.floor(x + w * 0.4);
                const cy = Math.floor(y + h * 0.4);
                const cw = Math.max(4, Math.floor(w * 0.2));
                const ch = Math.max(4, Math.floor(h * 0.2));
                const d = colorCtx.getImageData(cx, cy, cw, ch).data;
                let r = 0, g = 0, b = 0, c = 0;
                for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; c++; }
                r = Math.round(r/c); g = Math.round(g/c); b = Math.round(b/c);
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                if (max < 45) return "Negru";
                if (min > 205) return "Alb";
                if (max - min < 28) return "Gri";
                if (r > g && r > b) return (g > 130) ? "Galben/Portocaliu" : "Roșu";
                if (g > r && g > b) return "Verde";
                return "Albastru";
            } catch (e) { return ""; }
        }

        async function init() {
            try {
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                statusMsg.innerText = "AI gata. Pornește camera!";
                pornesteCamera();
            } catch (e) {
                statusMsg.innerText = "Eroare AI: " + e.message;
            }
        }

        async function pornesteCamera() {
            statusMsg.innerText = "Se cere acces cameră...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                await video.play();
                startCamBtn.style.display = "none";
                statusMsg.innerText = "Scanare activă";
                buclaDetectie();
            } catch (err) {
                startCamBtn.style.display = "block";
                statusMsg.innerText = "Apasă butonul verde (Eroare: " + err.name + ")";
            }
        }

        async function buclaDetectie() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(buclaDetectie);
                return;
            }
            if (canvas.width !== video.clientWidth || canvas.height !== video.clientHeight) {
                canvas.width = video.clientWidth;
                canvas.height = video.clientHeight;
            }
            if (colorCanvas.width !== video.videoWidth || colorCanvas.height !== video.videoHeight) {
                colorCanvas.width = video.videoWidth;
                colorCanvas.height = video.videoHeight;
            }
            colorCtx.drawImage(video, 0, 0, colorCanvas.width, colorCanvas.height);

            const preds = await model.detect(video, 8, 0.55);
            const now = performance.now();
            fpsMsg.innerText = Math.round(1000 / (now - lastTime)) + " FPS";
            lastTime = now;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const vRatio = video.videoWidth / video.videoHeight;
            const sRatio = canvas.width / canvas.height;
            let scale, offX = 0, offY = 0;
            if (sRatio > vRatio) {
                scale = canvas.width / video.videoWidth;
                offY = (canvas.height - video.videoHeight * scale) / 2;
            } else {
                scale = canvas.height / video.videoHeight;
                offX = (canvas.width - video.videoWidth * scale) / 2;
            }

            preds.forEach(p => {
                const [rx, ry, rw, rh] = p.bbox;
                const x = rx * scale + offX;
                const y = ry * scale + offY;
                const w = rw * scale;
                const h = rh * scale;

                const nume = traduceri[p.class] || p.class.toUpperCase();
                const cul = getCuloare(rx, ry, rw, rh);
                const text = `${nume} • ${cul} (${Math.round(p.score*100)}%)`;

                ctx.strokeStyle = "#00e676";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = "bold 14px sans-serif";
                const tw = ctx.measureText(text).width;
                const ly = y > 28 ? y - 26 : y + 6;
                ctx.fillStyle = "rgba(0, 230, 118, 0.9)";
                ctx.fillRect(x, ly, tw + 12, 22);
                ctx.fillStyle = "#000";
                ctx.fillText(text, x + 6, ly + 16);
            });

            requestAnimationFrame(buclaDetectie);
        }

        async function analizeazaExact() {
            const key = apiInput.value.trim() || localStorage.getItem('gemini_api_key');
            if (!key) {
                alert("Introdu cheia API în căsuța de sus și apasă Salvează!");
                return;
            }
            if (video.readyState !== 4) {
                alert("Pornește camera mai întâi!");
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "Se analizează...";
            resultBox.style.display = "block";
            resultBox.innerText = "Se identifică obiectul, culoarea și detaliile...";

            try {
                const c = document.createElement('canvas');
                c.width = video.videoWidth;
                c.height = video.videoHeight;
                c.getContext('2d').drawImage(video, 0, 0);
                const b64 = c.toDataURL('image/jpeg', 0.8).split(',')[1];

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Identifică exact ce se află în centrul imaginii. Răspunde scurt în română pe 3 rânduri (atinge caseta ca să o închizi):\n• Ce / Cine este: [obiect exact, marcă, model sau persoană]\n• Culoare: [culorile exacte]\n• Detalii / Text: [text vizibil, stare]" },
                                { inline_data: { mime_type: "image/jpeg", data: b64 } }
                            ]
                        }]
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || "Eroare API");
                resultBox.innerText = (data.candidates?.[0]?.content?.parts?.[0]?.text || "Niciun rezultat") + "\n\n(Apasă pe această casetă pentru a o închide)";
            } catch (e) {
                resultBox.innerText = "Eroare: " + e.message;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "Analizează exact (Ce / Cine / Culoare)";
            }
        }

        init();
    </script>
</body>
</html>

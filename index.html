<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Total Live v4</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #top-bar {
            background: rgba(20, 20, 20, 0.92);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
            border-bottom: 1px solid #333;
        }
        #key-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #api-input {
            flex: 1;
            min-width: 120px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #00e676;
            background: #000;
            color: #00e676;
            font-size: 13px;
        }
        #save-btn {
            padding: 8px 14px;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }
        #status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #ccc;
        }
        #toggle-key-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
        }
        #camera-area {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }
        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        canvas { z-index: 5; pointer-events: none; }
        #manual-cam-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            padding: 16px 26px;
            font-size: 16px;
            font-weight: bold;
            background: #00e676;
            color: #000;
            border: none;
            border-radius: 12px;
            display: none;
        }
        #bottom-bar {
            position: absolute;
            bottom: 20px; left: 12px; right: 12px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #result-box {
            width: 100%;
            max-height: 45vh;
            overflow-y: auto;
            background: rgba(12, 14, 18, 0.95);
            border: 1.5px solid #00e676;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            white-space: pre-line;
            box-shadow: 0 6px 24px rgba(0,0,0,0.8);
        }
        #result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00e676;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #333;
        }
        #close-res {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            padding: 0 6px;
        }
        #analyze-btn {
            width: 100%;
            max-width: 360px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(41, 121, 255, 0.5);
        }
        #analyze-btn:disabled { background: #555; box-shadow: none; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="key-row">
            <input type="text" id="api-input" placeholder="Lipește cheia API aici...">
            <button id="save-btn" onclick="salveazaCheie()">Salvează</button>
        </div>
        <div id="status-row">
            <span id="status-msg">Se pornește camera...</span>
            <div>
                <button id="toggle-key-btn" onclick="toggleKeyBar()">Ascunde Key</button>
                <span id="fps-msg" style="margin-left: 6px; color: #00e676; font-weight: bold;">0 FPS</span>
            </div>
        </div>
    </div>

    <div id="camera-area">
        <button id="manual-cam-btn" onclick="pornesteCamera()">Pornește Camera</button>
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="bottom-bar">
            <div id="result-box">
                <div id="result-header">
                    <span>Tot ce vede camera (AI)</span>
                    <button id="close-res" onclick="document.getElementById('result-box').style.display='none'">✕</button>
                </div>
                <div id="result-content"></div>
            </div>
            <button id="analyze-btn" onclick="analizeazaTot()">Scanează TOT ce vede (AI)</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusMsg = document.getElementById('status-msg');
        const fpsMsg = document.getElementById('fps-msg');
        const apiInput = document.getElementById('api-input');
        const keyRow = document.getElementById('key-row');
        const toggleKeyBtn = document.getElementById('toggle-key-btn');
        const manualCamBtn = document.getElementById('manual-cam-btn');
        const analyzeBtn = document.getElementById('analyze-btn');
        const resultBox = document.getElementById('result-box');
        const resultContent = document.getElementById('result-content');

        const colorCanvas = document.createElement('canvas');
        const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });

        let model = null;
        let lastTime = performance.now();

        const savedKey = localStorage.getItem('gemini_api_key') || '';
        apiInput.value = savedKey;
        if (savedKey) {
            keyRow.style.display = 'none';
            toggleKeyBtn.innerText = 'Arată Key';
        }

        function toggleKeyBar() {
            if (keyRow.style.display === 'none') {
                keyRow.style.display = 'flex';
                toggleKeyBtn.innerText = 'Ascunde Key';
            } else {
                keyRow.style.display = 'none';
                toggleKeyBtn.innerText = 'Arată Key';
            }
        }

        function salveazaCheie() {
            const val = apiInput.value.trim();
            if (!val) {
                alert("Lipește cheia în căsuța din stânga!");
                return;
            }
            localStorage.setItem('gemini_api_key', val);
            statusMsg.innerText = "Cheie API salvată!";
            keyRow.style.display = 'none';
            toggleKeyBtn.innerText = 'Arată Key';
        }

        const traduceri = {
            "person": "Persoană", "bicycle": "Bicicletă", "car": "Mașină", "motorcycle": "Motocicletă",
            "airplane": "Avion", "bus": "Autobuz", "train": "Tren", "truck": "Camion", "boat": "Barcă",
            "traffic light": "Semafor", "fire hydrant": "Hidrant", "stop sign": "Semn Stop",
            "bench": "Bancă", "bird": "Pasăre", "cat": "Pisică", "dog": "Câine", "horse": "Cal",
            "backpack": "Rucsac", "umbrella": "Umbrelă", "handbag": "Geantă", "tie": "Cravată",
            "suitcase": "Valiză", "sports ball": "Minge", "bottle": "Sticlă", "wine glass": "Pahar vin",
            "cup": "Cană / Pahar", "fork": "Furculiță", "knife": "Cuțit", "spoon": "Lingură",
            "bowl": "Bol / Castron", "banana": "Banană", "apple": "Măr", "sandwich": "Sandviș",
            "orange": "Portocală", "broccoli": "Broccoli", "carrot": "Morcov", "pizza": "Pizza",
            "donut": "Gogoașă", "cake": "Prăjitură", "chair": "Scaun", "couch": "Canapea",
            "potted plant": "Plantă", "bed": "Pat", "dining table": "Masă", "toilet": "Toaletă",
            "tv": "TV / Monitor", "laptop": "Laptop", "mouse": "Mouse", "remote": "Telecomandă",
            "keyboard": "Tastatură", "cell phone": "Telefon", "microwave": "Cuptor microunde",
            "oven": "Cuptor", "toaster": "Prăjitor", "sink": "Chiuvetă", "refrigerator": "Frigider",
            "book": "Carte", "clock": "Ceas", "vase": "Vază", "scissors": "Foarfecă",
            "teddy bear": "Ursuleț", "hair drier": "Uscător păr", "toothbrush": "Periuță dinți"
        };

        function getCuloare(x, y, w, h) {
            try {
                const cx = Math.floor(x + w * 0.4);
                const cy = Math.floor(y + h * 0.4);
                const cw = Math.max(4, Math.floor(w * 0.2));
                const ch = Math.max(4, Math.floor(h * 0.2));
                const d = colorCtx.getImageData(cx, cy, cw, ch).data;
                let r = 0, g = 0, b = 0, c = 0;
                for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; c++; }
                r = Math.round(r/c); g = Math.round(g/c); b = Math.round(b/c);
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                if (max < 45) return "Negru";
                if (min > 205) return "Alb";
                if (max - min < 28) return "Gri";
                if (r > g && r > b) return (g > 130) ? "Galben/Portocaliu" : "Roșu";
                if (g > r && g > b) return "Verde";
                return "Albastru";
            } catch (e) { return ""; }
        }

        async function pornesteCamera() {
            manualCamBtn.style.display = "none";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                await video.play();
                statusMsg.innerText = model ? "Scanare live activă" : "Cameră activă (se încarcă AI...)";
                buclaDetectie();
            } catch (err) {
                manualCamBtn.style.display = "block";
                statusMsg.innerText = "Apasă butonul verde (" + err.name + ")";
            }
        }

        async function incarcaAI() {
            try {
                model = await cocoSsd.load({ base: 'mobilenet_v2' });
                statusMsg.innerText = "Scanare live activă (Precizie mare)";
            } catch (e) {
                statusMsg.innerText = "Cameră activă";
            }
        }

        async function buclaDetectie() {
            if (video.readyState === 4) {
                if (canvas.width !== video.clientWidth || canvas.height !== video.clientHeight) {
                    canvas.width = video.clientWidth;
                    canvas.height = video.clientHeight;
                }

                if (model) {
                    if (colorCanvas.width !== video.videoWidth || colorCanvas.height !== video.videoHeight) {
                        colorCanvas.width = video.videoWidth;
                        colorCanvas.height = video.videoHeight;
                    }
                    colorCtx.drawImage(video, 0, 0, colorCanvas.width, colorCanvas.height);

                    // Detectează până la 15 obiecte simultan, prag 0.45
                    const preds = await model.detect(video, 15, 0.45);
                    const now = performance.now();
                    fpsMsg.innerText = Math.round(1000 / (now - lastTime)) + " FPS";
                    lastTime = now;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const vRatio = video.videoWidth / video.videoHeight;
                    const sRatio = canvas.width / canvas.height;
                    let scale, offX = 0, offY = 0;
                    if (sRatio > vRatio) {
                        scale = canvas.width / video.videoWidth;
                        offY = (canvas.height - video.videoHeight * scale) / 2;
                    } else {
                        scale = canvas.height / video.videoHeight;
                        offX = (canvas.width - video.videoWidth * scale) / 2;
                    }

                    preds.forEach(p => {
                        const [rx, ry, rw, rh] = p.bbox;
                        const x = rx * scale + offX;
                        const y = ry * scale + offY;
                        const w = rw * scale;
                        const h = rh * scale;

                        const nume = traduceri[p.class] || p.class.toUpperCase();
                        const cul = getCuloare(rx, ry, rw, rh);
                        const text = `${nume} • ${cul} (${Math.round(p.score*100)}%)`;

                        ctx.strokeStyle = "#00e676";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
                        ctx.stroke();

                        ctx.font = "bold 13px sans-serif";
                        const tw = ctx.measureText(text).width;
                        const ly = y > 26 ? y - 24 : y + 6;
                        ctx.fillStyle = "rgba(0, 230, 118, 0.92)";
                        ctx.fillRect(x, ly, tw + 10, 20);
                        ctx.fillStyle = "#000";
                        ctx.fillText(text, x + 5, ly + 15);
                    });
                }
            }
            requestAnimationFrame(buclaDetectie);
        }

        async function analizeazaTot() {
            const key = apiInput.value.trim() || localStorage.getItem('gemini_api_key');
            if (!key) {
                keyRow.style.display = 'flex';
                alert("Lipește cheia API în căsuța de sus și apasă Salvează!");
                return;
            }
            if (video.readyState !== 4) {
                alert("Pornește camera mai întâi!");
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "Se scanează tot cadrul...";
            resultBox.style.display = "block";
            resultContent.innerText = "Se identifică toate obiectele, persoanele și textele din imagine...";

            try {
                const c = document.createElement('canvas');
                c.width = video.videoWidth;
                c.height = video.videoHeight;
                c.getContext('2d').drawImage(video, 0, 0);
                const b64 = c.toDataURL('image/jpeg', 0.9).split(',')[1];

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Listează ABSOLUT TOT ce vezi în această imagine, fără să omiți nimic (fiecare obiect, produs, persoană, mobilier, text de pe etichete sau fundal). Răspunde în română, sub formă de listă clară cu liniuță (-), menționând pentru fiecare: ce/cine este exact (marcă/model dacă se vede), ce culoare are și unde este poziționat (ex: centru, stânga, dreapta, fundal)." },
                                { inline_data: { mime_type: "image/jpeg", data: b64 } }
                            ]
                        }]
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || "Eroare API");
                resultContent.innerText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Nu am detectat nimic.";
            } catch (e) {
                resultContent.innerText = "Eroare: " + e.message;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "Scanează TOT ce vede (AI)";
            }
        }

        pornesteCamera();
        incarcaAI();
    </script>
</body>
</html>
